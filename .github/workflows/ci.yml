name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # publish.yml runs the same checks before a release

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.17.4
      - run: ruff check metalmeter tests validation

  test:
    # Hosted macOS runners are virtual machines without a GPU, so the GPU tests skip there and
    # run on a real Mac before each release (validation/validate.py). Linux runs the parsers
    # and the sampler from recorded readings.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest -q
